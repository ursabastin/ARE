<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Shield Gradient: Forest Sage to Deep Pine -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f6212" />
      <stop offset="100%" stop-color="#1a2e07" />
    </linearGradient>

    <!-- Golden Sprout Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Shield -->
  <path d="M 22 18 C 40 13 50 12 64 12 C 78 12 88 13 106 18 C 110 40 110 60 108 70 C 104 92 84 108 64 118 C 44 108 24 92 20 70 C 18 60 18 40 22 18 Z" 
        fill="#4d7c0f" opacity="0.25" filter="url(#softGlow)" />

  <!-- Shield Base -->
  <path d="M 22 18 C 40 13 50 12 64 12 C 78 12 88 13 106 18 C 110 40 110 60 108 70 C 104 92 84 108 64 118 C 44 108 24 92 20 70 C 18 60 18 40 22 18 Z" 
        fill="url(#shieldGrad)" stroke="#a3e635" stroke-width="3" stroke-linejoin="round" />

  <!-- Mindful Halo Circle (Ensō / Sanctuary ring) -->
  <circle cx="64" cy="58" r="26" fill="none" stroke="#fef3c7" stroke-width="2" stroke-dasharray="7 3" opacity="0.45" />

  <!-- Golden Sprout Stem and Main Leaf -->
  <path d="M 64 90 C 84 80 86 54 64 38 C 42 54 44 80 64 90 Z" 
        fill="url(#leafGrad)" />

  <!-- Secondary Sprout Petal -->
  <path d="M 62 74 C 44 70 40 54 50 50 C 58 56 62 66 62 74 Z" 
        fill="#fef08a" opacity="0.9" />

  <!-- Leaf Central Spine -->
  <line x1="64" y1="88" x2="64" y2="44" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />

  <!-- Star / Beacon Dot at Leaf Tip -->
  <circle cx="64" cy="38" r="3.2" fill="#ffffff" />
  <circle cx="64" cy="38" r="5.5" fill="#fde68a" opacity="0.4" />
</svg>
